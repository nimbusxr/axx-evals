# What the verifier checks for this task (see README.md, "How a task is verified").
# The first run is a plain `axx run`: axx must start the service from the agent's axx.yaml.
# Like init-first-feature, the agent sets the repository up as it sees fit; it must
# find the packs the criteria need (the database and Kafka) on its own.
allowed = ["**"]
protected = ["README.md", "openapi.yaml", "docs/**", "schemas/**"]
required = ["axx.yaml", "features/**/*.feature"]
config_keys = ["*"]
start_apps = true
min_scenarios = 3
mutants = ["import-drops-postcode", "import-leaves-line-pending", "import-wrong-source", "import-accepts-overweight", "event-not-published", "event-weight-in-kilograms"]
variants = ["json-properties-reordered", "import-takes-seconds", "events-topic-gzip"]
