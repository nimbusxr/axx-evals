# What the verifier checks for this task without axx (see README.md, "The plain condition").
mode = "command"
allowed = ["**"]
protected = ["README.md", "openapi.yaml", "docs/**", "infra/**", "schemas/**"]
required = ["acceptance-tests.sh"]
mutants = ["change-after-pickup", "refused-change-stored", "cancel-after-pickup", "update-not-persisted"]
variants = ["json-properties-reordered"]
