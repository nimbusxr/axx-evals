# Generated by `go run ./cmd/evals sync` from ../task.toml: the task without axx; do not edit.
schema_version = "1.4"

[task]
name = "axx-evals/change-rules-plain"
description = "Acceptance tests for the rules of changing and cancelling a parcel: refused once a depot picked it up, and the refused change not stored."
keywords = ["axx", "gherkin", "acceptance-testing", "rest", "sql"]

[metadata]
title = "Business rules: no change or cancellation after pickup"
difficulty = "hard"
category = "rules"
requires = ["rest"]
services = ["postgres", "mongo", "address-service"]
workspace = "common"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096

[environment.healthcheck]
command = "wait-for-services"
interval_sec = 2.0
timeout_sec = 10.0
start_period_sec = 120.0
retries = 60

[[artifacts]]
source = "/app"
exclude = [".axx", ".git"]
